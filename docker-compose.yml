services:
  web:
    build: .
    container_name: si-ruangan-web
    ports:
      - "8085:80"
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - siruangan-net

  frontend:
    build: ./frontend
    container_name: si-ruangan-frontend
    restart: unless-stopped
    networks:
      - siruangan-net

  backend:
    build: ./backend
    container_name: si-ruangan-backend
    restart: unless-stopped
    volumes:
      # Mount the Google OAuth credentials file from the host home directory.
      # Local path: ~/google-login-credentials.json
      # Server path: ~/google-login-credentials.json
      - ~/google-login-credentials.json:/app/credentials/google-login-credentials.json:ro
      # Persistent SQLite database
      - siruangan-data:/app/data
    environment:
      - GOOGLE_CREDENTIALS_FILE=/app/credentials/google-login-credentials.json
      - DATABASE_PATH=/app/data/siruangan.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-primaadipradana@mail.ugm.ac.id,dimasihdammaulana@mail.ugm.ac.id,hanan.f.r@mail.ugm.ac.id}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8085}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    networks:
      - siruangan-net

networks:
  siruangan-net:
    driver: bridge

volumes:
  siruangan-data:
