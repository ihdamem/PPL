services:
  web:
    build: .
    container_name: si-ruangan-web
    ports:
      - "8085:80"
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - siruangan-net

  frontend:
    build: ./frontend
    container_name: si-ruangan-frontend
    restart: unless-stopped
    networks:
      - siruangan-net

  backend:
    build: ./backend
    container_name: si-ruangan-backend
    restart: unless-stopped
    volumes:
      # Mount the Google OAuth credentials file from the host home directory.
      # Local path: ~/google-login-credentials.json
      # Server path: ~/google-login-credentials.json
      - ~/google-login-credentials.json:/app/credentials/google-login-credentials.json:ro
    environment:
      - GOOGLE_CREDENTIALS_FILE=/app/credentials/google-login-credentials.json
      - CORS_ORIGINS=http://localhost:8085
    networks:
      - siruangan-net

networks:
  siruangan-net:
    driver: bridge
